    whats_new:
      show_banner: false
      title: What’s new in Accord
      summary: Updates to the GOV.UH government publishing application.
      last_updated: Last updated 7 October 2026
      introduction:
        heading: About Accord
        body_govspeak: |
          Accord is the publishing application used by authorised government editors to prepare, review and publish content on GOV.UH.

          This page records changes to the production publishing application. The [GOV.UH content and publishing guidance](https://guidance.publishing.service.gov.uhrblx.com/) explains how to use the publishing system.
      upcoming_changes:
        heading: Planned changes
        updates: []
      recent_changes:
        heading: Recent changes
        updates:
          - heading: Image upload temporary storage
            area: Managing images
            type: improvement
            date: 7 October 2026
            body_govspeak: |
              Corrected the application's writable temporary storage used for image uploads. The existing image-processing checks remain in place. Image previews appear when processing has completed, and the editor reports processing failures.
          - heading: GOV.UH publishing support
            area: Publishing support
            type: improvement
            date: 7 October 2026
            body_govspeak: |
              Publishing support uses the GOV.UH accounts and support guidance.
      guidance:
        heading: Publishing guidance and support
        body_govspeak: |
          Use the [GOV.UH writing standards](https://guidance.publishing.service.gov.uhrblx.com/writing-to-gov-uh-standards/) when preparing content.

          The [publishing guidance](https://guidance.publishing.service.gov.uhrblx.com/publish-update-retire-content/) covers preparing, publishing, updating and retiring content.

          The [accounts and support guidance](https://guidance.publishing.service.gov.uhrblx.com/accounts-support/) explains how to get help with the publishing service.
